<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کوئرا لیست - مدیریت وظایف</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../src/style.css" />
    <style type="text/tailwindcss">
      @theme {
        --color-primary-light: #2c7ef8;
        --color-primary-hover-light: #075cd9;
        --color-on-primary-light: #ffffff;
        --color-background-light: #ffffff;
        --color-foreground-light: #191c1e;
        --color-surface-light: #ffffff;
        --color-primary-dark: #3a86f8;
        --color-primary-hover-dark: #6ba4fa;
        --color-on-primary-dark: #ffffff;
        --color-background-dark: #040810;
        --color-foreground-dark: #e6e9ef;
        --color-surface-dark: #e6e9ef;
        --color-success: #90f677;
        --color-error: #e63946;
      }
    </style>
  </head>

  <!-- Side bar  -->
  <body class="bg-[#f5f6f8]" id="body">
    <section class="flex flex-row">
      <aside
        class="bg-on-primary-light h-[calc(100vh-40px)] p-7 mr-7 mt-5 shadow-sm w-[300px] rounded-2xl"
      >
        <div class="flex flex-row gap-2 mt-5">
          <img
            src="../src/assets/images/user5.png"
            alt="user5"
            class="w-[48px] h-[48px] rounded-full"
          />
          <div class="flex flex-col gap-2">
            <p class="text-foreground-light font-extrabold">سلام، رویا</p>
            <p class="font-semibold text-xs text-[#7D7D7F]">
              سه شنبه، ۵ بهمن ۱۴۰۲
            </p>
          </div>
        </div>
      </aside>

      <main class="flex flex-col flex-1 gap-6 py-15 px-70">
        <!-- Header -->
        <div class="flex flex-col gap-2">
          <p class="text-foreground-light font-extrabold text-2xl">
            تسک های امروز
          </p>
          <p class="font-semibold text-sm text-[#7D7D7F]">
            3 تسک را باید انجام دهید
          </p>
        </div>

        <!-- Add Task Button -->
        <div id="add-task" class="flex justify-center items-center px-4 mb-17">
          <button
            class="w-full border-2 border-dashed border-gray-300 rounded-lg p-4 text-primary-light hover:text-[#7D7D7F] hover:border-primary-hover-light transition-colors cursor-pointer flex items-center justify-start gap-2"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              ></path>
            </svg>
            <span>افزودن وظیفه جدید</span>
          </button>
        </div>
        <!-- Add task Layout  -->
        <section
          id="task-layout"
          class="bg-on-primary-light w-full mx-auto rounded-md border-[##E9E9E9] shadow-sm hidden"
        >
          <input
            type="text"
            placeholder="نام تسک"
            id="title-input"
            class="block w-full mx-auto my-1 px-3 pt-2 rounded-md focus:outline-none placeholder:font-bold placeholder:text-base"
          />
          <input
            type="text"
            placeholder="توضیحات "
            id="desc-input"
            class="block w-full mx-auto mt-2 mb-5 px-3 rounded-md focus:outline-none placeholder:font-semibold placeholder:text-sm"
          />

          <div class="mr-5 flex flex-col items-start gap-3 mt-2">
            <div
              id="tags-handler"
              class="inline-flex items-center gap-2 px-3 py-1 bg-on-primary-light text-gray-700 text-sm rounded-md border border-gray-200 cursor-pointer shadow-sm"
            >
              <div id="tag-icon" class="arrow transition-all duration-300">
                <img src="../src/assets/icons/tag-right.svg" alt="" />
              </div>
              <span>تگ ها</span>
            </div>
            <!-- Selected Priority  -->
            <div id="selected-priority">
              <!-- <button
                type="button"
                data-priority="low"
                class="flex gap-1 px-2 py-1 rounded-md bg-[#C3FFF1] text-[#11A483] text-sm cursor-pointer"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-3 my-auto text-black"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6 18 18 6M6 6l12 12"
                  />
                </svg>

                پایین
              </button> -->
            </div>

            <div
              id="priority-group"
              class="items-center gap-2 px-2 py-1 rounded-md bg-on-primary-light shadow-lg border border-gray-100 hidden"
            >
              <button
                type="button"
                data-priority="low"
                class="px-2 py-1 rounded-md bg-[#C3FFF1] text-[#11A483] text-sm cursor-pointer"
              >
                پایین
              </button>

              <button
                type="button"
                data-priority="medium"
                class="px-2 py-1 rounded-md bg-[#FFEFD6] text-[#FFAF37] text-sm cursor-pointer"
              >
                متوسط
              </button>
              <button
                type="button"
                data-priority="high"
                class="px-2 py-1 rounded-md bg-[#FFE2DB] text-[#FF5F37] text-sm cursor-pointer"
              >
                بالا
              </button>
            </div>
          </div>
          <div
            class="border-t-1 border-[#E9E9E9] mt-5 flex items-center justify-end"
          >
            <button
              id="addTaskBtn"
              class="w-1/5 rounded-md text-on-primary-light text-center px-2 py-1 my-5 ml-3 bg-primary-light cursor-pointer hover:bg-primary-hover-light transition-all"
            >
              اضافه کردن تسک
            </button>
          </div>
        </section>
        <!-- Image Area-->
        <div id="image" class="rounded-lg p-8 text-center">
          <div class="max-w-md mx-auto">
            <div
              class="w-full h-32 mx-auto mb-16 flex items-center justify-center"
            >
              <img
                src="../src/assets/images/2143202_Artboard width.png"
                alt="task"
                class="w-[400px] h-[300px] mb-12"
              />
            </div>
            <h3 class="text-lg font-extrabold text-[#7D7D7F] mb-2">
              چه کارهایی امروز برای انجام داری؟
            </h3>
            <p class="text-sm text-[#AFAEB2] font-semibold">
              میتونی الان تسک ها تو اینجا بنویسی و برنامه ریزی رو شروع کنی!
            </p>
          </div>
        </div>

        <!-- Completed Tasks Section -->
        <div class="space-y-4">
          <div class="flex flex-col gap-2">
            <h2 class="text-foreground-light font-extrabold text-xl">
              تسک های انجام شده
            </h2>
            <p class="text-sm text-gray-500">3 تسک انجام شده است.</p>
          </div>

          <!-- تسک -->
          <!-- <div
            class="relative flex items-center justify-between bg-white shadow-sm rounded-lg px-5 py-6  "
          >
          <span class="absolute right-0 top-3 bottom-3 w-1 rounded bg-[#11A483]"></span>
            <input
              type="checkbox"
              checked
              class="w-5 h-5 text-blue-500 border-gray-300 rounded focus:ring-0 cursor-pointer"
            />
            <span class="flex-1 text-gray-800 text-sm mx-3">
              تماس با میل فروشچی در مورد تأخیر در ارسال
            </span>
            <button class="text-gray-500 hover:text-gray-700 cursor-pointer">
              ⋮
            </button>
          </div> -->

          <div class="space-y-3"></div>
        </div>
      </main>
    </section>
    <script src="../src/scripts/main.js"></script>
  </body>
</html>
